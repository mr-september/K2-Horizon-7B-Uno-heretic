# Heretic 2.x combined run: refusal suppression + sycophancy reduction, KL-preserved.
# One ARA modification co-optimizing both behaviors (single-pass, lower cumulative
# KL tax than sequential default+nosyco passes).

# Local snapshot of hermitdave/K2-Horizon-7B-Uno-merged (chat_template default
# reasoning_effort patched to 'medium' for eval speed; restored on export).
model = "model"

# Non-interactive: save merged model here instead of prompting.
action = "save"
export = "merge"
save_directory = "output"

# Resume the completed 100-trial study and select Pareto front index 3
# (trial#77: Refusals 3%, sycophancy 0%, KL 0.191 — best behavior-per-KL).
checkpoint_action = "continue"
trial_index = 3

# K2-Horizon uses IFM thinking tags; heretic must skip the CoT block so keyword
# scoring evaluates the actual answer, not the thinking block.
chain_of_thought_blocks = [
    ["<ifm|think>", "</ifm|think>"],
    ["<ifm|think_fast>", "</ifm|think_fast>"],
    ["<ifm|think_faster>", "</ifm|think_faster>"],
]

modified_model_type = "decensored"

upload_tags = [
    "uncensored",
    "decensored",
    "abliterated",
    "no-sycophancy",
]

scorers = [
    # Instance 1 (default): refusal keywords on harmful prompts.
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
    # Instance 2: sycophancy markers on praise prompts (from config.nosyco.toml).
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize", instance_name = "yco" },
    # Preservation term against the unmodified base.
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

modifiers = [
    { plugin = "heretic.modifiers.ara.ARA" },
]

# --- Scorer settings -------------------------------------------------------

